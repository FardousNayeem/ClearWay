[project]
name = "clearway-api"
version = "0.1.0"
description = "Air quality nowcast, forecast and exposure guidance from open data"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ANN", "PT"]
# B008: FastAPI depends on callables in argument defaults (Query, Depends).
ignore = ["ANN401", "RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = "(migrations|tests)"

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*"]
